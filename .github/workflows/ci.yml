# CI(実装方針 §7.3-1)。コアのテストとフロントの型チェック+ビルドを回す。
# sidecarスモーク(ビルド成果物の起動→handshake→/health)はPhase 2着手前に追加する。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core with dev deps
        run: pip install -e "./core[dev]"
      - name: Lint (ruff + format check)
        run: |
          python -m ruff check core/sentinel_core core/tests
          python -m ruff format --check core/sentinel_core core/tests
      - name: Type check (mypy strict)
        run: python -m mypy
        working-directory: core
      - name: Run tests
        run: python -m pytest core/tests -q

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Lint (ESLint + Prettier check)
        run: |
          npm run lint
          npm run format:check
        working-directory: app
      - name: Type check + build
        run: npm run build
        working-directory: app

  # Tauri(Rust)のコンパイル確認。Windows 実機で初めて壊れていると分かる状態を防ぐ
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend (release の generate_context! が dist を埋め込むため)
        run: npm ci && npm run build
        working-directory: app
      - name: Clippy (debug + release)
        run: |
          cargo clippy -- -D warnings
          cargo clippy --release -- -D warnings
        working-directory: app/src-tauri
