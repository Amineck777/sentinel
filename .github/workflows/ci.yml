# CI(実装方針 §7.3-1)。コアのテストとフロントの型チェック+ビルドを回す。
# sidecar ジョブで、配布用の単体実行ファイルが起動できるかも確かめる(方針 §5)。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 下限(pyproject の requires-python)と、ロードマップの標準版
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core with dev deps
        run: pip install -e "./core[dev]"
      - name: Lint (ruff + format check)
        run: |
          python -m ruff check core/sentinel_core core/tests
          python -m ruff format --check core/sentinel_core core/tests
      - name: Type check (mypy strict)
        run: python -m mypy
        working-directory: core
      - name: Run tests
        run: python -m pytest core/tests -q

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 配布規約で再配布禁止のモデルがあるため、モデル類が追跡されていたら落とす(ADR 0109)。
      # VOICEVOX CORE の音声モデル・ONNX Runtime・wheel も同じく入れない(ADR 0115)
      - name: Guard against committed models and binaries
        run: |
          if git ls-files | grep -iE '\.(vrm|vroid|unitypackage|psd|vvm|onnx|whl|dll|dylib|so)$|(^|/)\.env\.local$'; then
            echo "::error::モデル・バイナリ等がリポジトリに含まれています。git rm --cached で外してください"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Lint (ESLint + Prettier check)
        run: |
          npm run lint
          npm run format:check
        working-directory: app
      - name: Type check + build
        run: npm run build
        working-directory: app

  # Tauri(Rust)のコンパイル確認。Windows 実機で初めて壊れていると分かる状態を防ぐ
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend (release の generate_context! が dist を埋め込むため)
        run: npm ci && npm run build
        working-directory: app
      - name: Clippy (debug + release)
        run: |
          cargo clippy -- -D warnings
          cargo clippy --release -- -D warnings
        working-directory: app/src-tauri

  # 配布用 sidecar(PyInstaller)を作って実際に起動する。
  # handshake・/health・stdin を閉じたときの終了を確かめる(PyInstaller の import 漏れ=B9 を検出)
  sidecar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + PyInstaller
        run: pip install ./core pyinstaller
      - name: Build sidecar
        run: python scripts/build_sidecar.py
      - name: Smoke test sidecar
        run: python scripts/smoke_sidecar.py
