[project]
name = "sentinel-core"
version = "0.1.0"
description = "SENTINEL core process (FastAPI + local LLM orchestration)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
sentinel-core = "sentinel_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_core"]

# --- 静的解析(仕様 §5.4: ruff + mypy strict)---

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W=pycodestyle F=pyflakes I=isort UP=pyupgrade B=bugbear SIM=simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sentinel_core"]

# voicevox_core は任意(scripts/setup_voicevox_core.py で入れる)。CI には無いので型を探さない
[[tool.mypy.overrides]]
module = ["voicevox_core", "voicevox_core.*"]
ignore_missing_imports = true
