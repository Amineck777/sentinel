# 出荷既定値(仕様 §8)。ユーザー差分は {APP_DATA}/sentinel/config.yaml に置く。
# 正は core/sentinel_core/settings.py の DEFAULTS。このファイルは読むための写しで、
# 両者の一致は core/tests/test_settings.py が検査する(片方だけ変えるとテストが落ちる)。
llm:
  endpoint: "http://127.0.0.1:11434/v1"
  chat_model: "qwen2.5:7b-instruct"   # 例。Phase 0の計測結果で差し替える
  request_timeout_sec: 120
  think: false                        # 思考モデル(gemma4 等)の思考を切る。チャットの応答を速くするため
character:
  active: "none"
voice:                                # 返答の読み上げ。画面の設定(右上の歯車 → 声)の方が優先
  enabled: false
  engine: "auto"                      # auto / voicevox_core / voicevox / none(auto = 同梱 CORE があればそれ、無ければアプリ)
  endpoint: "http://127.0.0.1:50021"  # VOICEVOX(アプリかエンジン)の待ち受け先
  speaker_id: 122                     # 話者(スタイル)ID。122 = 暁記ミタマ(ノーマル)。null ならエンジンの最初の声
  speed: 1.0
  pitch: 0.0
  core:                               # 同梱の VOICEVOX CORE(scripts/setup_voicevox_core.py で入れる)
    dir: null                         # null なら {APP_DATA}/sentinel/voicevox_core
    cpu_threads: 0                    # 合成に使う CPU の数。0 なら CORE に任せる
memory:                               # 会話の記憶(docs/adr/0116)
  short_term_tokens: 2500             # 直近の会話をそのまま渡す分の上限(トークンは多めに見積もる)
  session_resume_hours: 6             # 最後に話してからこの時間以内なら、再起動しても会話の続きにする。0 で続けない
app:
  language: "ja"
